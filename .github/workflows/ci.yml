name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: AndreBaltazar8/setup-abla@f13f659af61ed16f0f2568964ff5b5f3344ec70a # main, signed Abla v0.2.67 support
        with:
          version: '0.2.67'
      - name: Run unit tests and examples
        run: make test-in-shell COMPILER=ablac
      - name: Run interoperability tests against zbar
        run: |
          make interop-programs COMPILER=ablac
          nix-shell -I "nixpkgs=$(nix eval --raw nixpkgs#path)" tools/interop-shell.nix \
            --run 'make interop-in-shell COMPILER=ablac'
